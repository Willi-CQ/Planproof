[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "planproof-feedback"
version = "0.1.0"
description = "Grounded Nemotron feedback and isolated Stoa zero-shot evaluation"
requires-python = ">=3.11"
dependencies = ["Pillow==11.1.0", "pypdfium2==4.30.0"]

[project.optional-dependencies]
test = ["pytest==8.3.5", "ruff==0.11.13"]

[project.scripts]
planproof-feedback = "planproof_feedback.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.artifacts/pytest-feedback"

[tool.ruff]
target-version = "py311"
line-length = 100
