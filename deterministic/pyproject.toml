[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "planproof-evidence"
version = "0.1.0"
description = "Local 2D drawing evidence, geometry and detector cross-checks"
requires-python = ">=3.11"
dependencies = [
  "numpy==1.26.4", "opencv-python-headless==4.11.0.86", "Pillow==11.1.0",
  "scipy==1.15.2", "shapely==2.0.7", "scikit-image==0.25.2",
  "pypdfium2==4.30.0",
]

[project.optional-dependencies]
test = ["pytest==8.3.5", "ruff==0.11.13"]

[project.scripts]
planproof-evidence = "planproof_evidence.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
