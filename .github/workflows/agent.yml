name: Question agent contracts
on:
  push:
    paths: ['backend/**', 'feedback/**', 'tools/benchmark_agent.py', '.github/workflows/agent.yml']
  pull_request:
    paths: ['backend/**', 'feedback/**', 'tools/benchmark_agent.py', '.github/workflows/agent.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.txt -e 'feedback[test]'
      - run: mkdir -p .artifacts
      - run: python -m pytest backend feedback/tests -q
      - run: python -m ruff check backend/question_agent.py backend/visual_specialist.py backend/agent_pipeline.py backend/run_local.py feedback/src feedback/tests tools/benchmark_agent.py
