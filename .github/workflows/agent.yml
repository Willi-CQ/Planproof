name: Question agent contracts
on:
  push:
    paths: ['backend/**', 'feedback/**', 'tools/*agent*.py', 'tools/*mvp*.py', 'tools/*case_review*', '.github/workflows/agent.yml']
  pull_request:
    paths: ['backend/**', 'feedback/**', 'tools/*agent*.py', 'tools/*mvp*.py', 'tools/*case_review*', '.github/workflows/agent.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.txt -e 'feedback[test]'
      - run: mkdir -p .artifacts
      - run: python -m pytest backend feedback/tests tools/test_agent_cohort.py tools/test_mvp.py tools/test_extend_case_review.py -q
      - run: python -m pytest tools/test_production_cohort.py tools/test_production_audit_report.py tools/test_agent_lab.py tools/test_agent_lab_report.py tools/test_agent_policy_suite.py tools/test_compare_agent_trials.py tools/test_audit_agent_evidence.py -q
      - run: python -m ruff check backend/native_text.py backend/vector_regions.py backend/specialist_views.py backend/test_specialist_views.py backend/test_count_units.py tools/prepare_agent_lab.py tools/run_agent_lab.py tools/prepare_agent_policy_suite.py tools/score_agent_policy_suite.py tools/compare_agent_trials.py tools/build_agent_lab_report.py
      - run: python -m ruff check tools/audit_agent_evidence.py tools/test_audit_agent_evidence.py
      - run: python -m ruff check backend/agent_profile.py backend/test_agent_profile.py
      - run: python -m ruff check backend/task_scope.py backend/test_task_scope.py backend/count_evidence.py backend/test_count_scope.py backend/test_count_handoff.py backend/test_specialist_authentication.py tools/audit_production_cohort.py tools/test_production_cohort.py
      - run: python -m ruff check backend/test_measurement_runs.py
      - run: python -m ruff check backend/task_report.py backend/test_task_report.py
      - run: python -m ruff check backend/algorithm_jobs.py backend/test_interactive_latency.py
      - run: python -m ruff check backend/specialist_routing.py backend/test_specialist_routing.py
      - run: python -m ruff check backend/test_measurement_recovery.py
      - run: python -m ruff check backend/answer_presentation.py backend/test_answer_presentation.py backend/run_tracking.py backend/test_run_tracking.py backend/question_agent.py backend/measurements.py backend/test_measurements.py backend/gemini_transport.py backend/test_gemini_transport.py backend/token_recovery.py backend/test_token_recovery.py backend/test_token_repair_agent.py backend/test_visual_specialist.py backend/visual_specialist.py backend/agent_pipeline.py backend/run_local.py feedback/src feedback/tests tools/benchmark_agent.py tools/select_agent_cohort.py tools/run_agent_cohort.py tools/test_agent_cohort.py tools/build_agent_report.py tools/mvp.py tools/test_mvp.py tools/run_resilience_probe.py tools/extend_case_review.py tools/test_extend_case_review.py backend/test_large_drawings.py
