name: Detection training checks
on:
  push:
    paths: ["ml/**", ".github/workflows/ml.yml"]
  pull_request:
    paths: ["ml/**", ".github/workflows/ml.yml"]
permissions:
  contents: read
jobs:
  cpu-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements.lock
      - name: Install CPU environment
        run: |
          python -m pip install torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
          python ml/scripts/cpu_requirements.py > /tmp/planproof-cpu.lock
          python -m pip install wheel==0.45.1 -r /tmp/planproof-cpu.lock
          python -m pip install --no-build-isolation --no-deps -e ml
      - name: Validate package and contracts
        run: |
          ruff check ml/src ml/tests
          ruff format --check ml/src ml/tests
          pytest ml/tests -q
          planproof-ml doctor --smoke
