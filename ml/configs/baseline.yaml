name: cubicasa-baseline
seed: 42
image_size: 1024
effective_batch: 16
micro_batch: 2
encoder_weights: imagenet
encoder_lr: 0.0001
head_lr: 0.0003
weight_decay: 0.01
crop_probability: 0.5
validation_every: 1000
validation_limit_per_source: 32
checkpoint_every: 1000
phases:
  - name: cubicasa_control
    steps: 40000
    lr_scale: 1.0
    sources: {cubicasa5k: 1.0}
