name: hackathon-first-detector
seed: 42
image_size: 512
effective_batch: 8
micro_batch: 4
data_workers: 4
encoder_weights: imagenet
encoder_lr: 0.0001
head_lr: 0.0003
weight_decay: 0.01
crop_probability: 0.5
validation_every: 100
validation_limit_per_source: 8
checkpoint_every: 100
phases:
  - name: first-usable-candidate
    steps: 2000
    lr_scale: 1.0
    sources: {cubicasa5k: 1.0}
