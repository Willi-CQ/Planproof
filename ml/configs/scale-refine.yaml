name: supervised-scale-aware-symbol-refinement
seed: 42
image_size: 1024
effective_batch: 4
micro_batch: 2
data_workers: 4
encoder_weights: null
encoder_lr: 0.00001
head_lr: 0.0001
weight_decay: 0.01
box_loss: giou
box_loss_weight: 0.5
box_size_loss_weight: 0.25
class_balanced_heads: true
crop_probability: 0.5
validation_every: 250
validation_limit_per_source: 32
checkpoint_every: 100
phases:
  - name: relative-size-learning-with-structural-replay
    steps: 2000
    lr_scale: 1.0
    sources: {cubicasa5k: 0.6, resplan: 0.1, floorplancad: 0.3}
