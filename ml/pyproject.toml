[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "planproof-ml"
version = "0.1.0"
description = "Floor-plan detection preparation, training, evaluation and export"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy==1.26.4", "Pillow==11.1.0", "opencv-python-headless==4.11.0.86",
  "scipy==1.15.2", "scikit-image==0.25.2", "shapely==2.0.7",
  "PyYAML==6.0.2", "requests==2.32.3", "svgpathtools==1.6.1",
  "torch==2.5.1", "torchvision==0.20.1", "segmentation-models-pytorch==0.5.0",
]
[project.optional-dependencies]
export = ["onnx==1.17.0", "onnxruntime==1.20.1"]
download = ["gdown==5.2.0"]
test = ["pytest==8.3.5", "ruff==0.11.13"]
[project.scripts]
planproof-ml = "planproof_ml.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
planproof_ml = ["assets/*.json"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 110
target-version = "py311"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
